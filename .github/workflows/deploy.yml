name: Deploy Elemento to GitHub Pages

on:
  push:
    branches: [main]
    paths-ignore:
      - 'README.md'
      - '.vscode/**'
      - '.gitignore'
      - 'LICENSE*'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Website (elemento)
        uses: actions/checkout@v4
        with:
          path: elemento

      - name: Checkout Theme (wisdom)
        uses: actions/checkout@v4
        with:
          repository: AshV/wisdom
          path: wisdom

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: elemento/package-lock.json

      - name: Install theme dependencies
        working-directory: wisdom
        run: npm ci

      - name: Install site dependencies
        working-directory: elemento
        run: npm ci

      - name: Cache Astro & Vite incremental build artifacts
        uses: actions/cache@v4
        with:
          path: |
            elemento/node_modules/.astro
            elemento/node_modules/.vite
          key: ${{ runner.os }}-elemento-build-${{ hashFiles('elemento/package-lock.json') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-elemento-build-${{ hashFiles('elemento/package-lock.json') }}-
            ${{ runner.os }}-elemento-build-

      - name: Build
        working-directory: elemento
        run: npm run build
        env:
          PUBLIC_FIREBASE_API_KEY: ${{ secrets.PUBLIC_FIREBASE_API_KEY || vars.PUBLIC_FIREBASE_API_KEY }}
          PUBLIC_FIREBASE_PROJECT_ID: ${{ secrets.PUBLIC_FIREBASE_PROJECT_ID || vars.PUBLIC_FIREBASE_PROJECT_ID }}
          PUBLIC_FIREBASE_DATABASE_URL: ${{ secrets.PUBLIC_FIREBASE_DATABASE_URL || vars.PUBLIC_FIREBASE_DATABASE_URL }}
          PUBLIC_FIREBASE_APP_ID: ${{ secrets.PUBLIC_FIREBASE_APP_ID || vars.PUBLIC_FIREBASE_APP_ID }}

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./elemento/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
